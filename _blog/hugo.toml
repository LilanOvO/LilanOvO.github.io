baseURL = 'https://lilanovo-research-notes.mightytang5.chatgpt.site/'
languageCode = 'en'
defaultContentLanguage = 'en'
title = 'Weiwei — AI Research Notes'
publishDir = 'dist'
enableRobotsTXT = true
hasCJKLanguage = false
summaryLength = 100
disableKinds = ['RSS']
[pagination]
  pagerSize = 10
  path = 'page'
[taxonomies]
  tag = 'tags'
[outputs]
  home = ['HTML', 'JSON']
[params]
  canonicalBaseURL = 'https://lilanovo.github.io/blog/'
  brand = 'Weiwei'
  author = 'Weiwei Qi'
  description = 'Research notes on LLM safety, alignment, and AI agents by Weiwei Qi.'
  homepage = 'https://lilanovo.github.io/'
  github = 'https://github.com/LilanOvO'
[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions.passthrough]
  enable = true
[markup.goldmark.extensions.passthrough.delimiters]
  block = [['\[', '\]'], ['$$', '$$']]
  inline = [['\(', '\)']]
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
[markup.highlight]
  noClasses = false
