<article class="post-row" data-topics="{{ delimit .Params.tags "|" }}"><div class="post-date">{{ .Date.Format "Jan 02" }}<span>{{ .Date.Format "2006" }}</span></div><div class="post-main"><div class="post-kind">{{ .Params.contentType }}</div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p><div class="post-tags">{{ range .Params.tags }}<a href="{{ (printf "tags/%s/" (. | urlize)) | relURL }}">{{ . }}</a>{{ end }}</div></div><div class="post-end"><span>{{ .Params.readingTime | default "3 min" }}</span><a href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}">↗</a></div></article>
