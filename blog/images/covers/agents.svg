<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" fill="none">
  <title>Agent tools behind a permission gate</title>
  <desc>Untrusted input enters an agent. A permission gate checks the agent's proposed call before it reaches a tool. A dashed boundary marks the trusted execution system.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M1 1 5 3 1 5" stroke="#8C9298" stroke-width="1" fill="none"/></marker>
  </defs>
  <path fill="#FFF" d="M0 0h440v250H0z"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="24" y="28" fill="#737980" font-size="10" letter-spacing="1.4">A BOUNDARY BEFORE ACTION</text>
    <rect x="142" y="72" width="266" height="116" rx="9" stroke="#BCCAD4" stroke-width="1.2" stroke-dasharray="4 5"/>
    <text x="157" y="63" fill="#7892A5" font-size="10">Trusted execution</text>
    <g stroke="#929BA3" stroke-width="1.2" marker-end="url(#arrow)">
      <path d="M98 126h58"/><path d="M217 126h39"/><path d="M287 126h43"/>
    </g>
    <g>
      <path d="M40 100h33l17 17v37H40z" fill="#FAF7F0" stroke="#C5AB7F" stroke-width="1.4"/>
      <path d="M72 100v18h18M51 130h25M51 137h20M51 144h15" stroke="#C5AB7F" stroke-width="1.2"/>
      <text x="65" y="177" text-anchor="middle" fill="#786952" font-size="11">Untrusted input</text>
    </g>
    <g>
      <rect x="160" y="104" width="55" height="44" rx="8" fill="#EDF3F6" stroke="#9FB5C4" stroke-width="1.3"/>
      <circle cx="179" cy="121" r="2.4" fill="#6C8DA3"/><circle cx="196" cy="121" r="2.4" fill="#6C8DA3"/>
      <path d="M179 133h17" stroke="#6C8DA3" stroke-width="1.5" stroke-linecap="round"/>
      <text x="187.5" y="169" text-anchor="middle" fill="#55778E" font-size="11">Agent</text>
    </g>
    <g>
      <path d="m272 110 14 5v12c0 10-14 17-14 17s-14-7-14-17v-12z" fill="#FAF5E9" stroke="#C09A60" stroke-width="1.4"/>
      <path d="m266 126 4 4 8-9" stroke="#AB844B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="272" y="169" text-anchor="middle" fill="#92713F" font-size="10">Permission gate</text>
    </g>
    <g>
      <rect x="337" y="104" width="54" height="44" rx="6" fill="#F6F7F8" stroke="#B5BFC7" stroke-width="1.3"/>
      <path d="m350 117 7 7-7 7m12 0h12" stroke="#6D7D8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="364" y="169" text-anchor="middle" fill="#617481" font-size="11">Tool call</text>
    </g>
    <text x="220" y="228" text-anchor="middle" fill="#8B9196" font-size="10">Treat retrieved content as data, not authorization.</text>
  </g>
</svg>
