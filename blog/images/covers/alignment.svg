<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" fill="none">
  <title>Proxy reward and intended behavior</title>
  <desc>A conceptual plot shows a proxy reward increasing with optimization while intended behavior improves initially and later declines. The curves are illustrative, not empirical data.</desc>
  <path fill="#FFF" d="M0 0h440v250H0z"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="24" y="28" fill="#737980" font-size="10" letter-spacing="1.4">WHEN THE OBJECTIVE DRIFTS</text>
    <g stroke="#EDF0F2" stroke-width="1">
      <path d="M55 72h343M55 112h343M55 152h343"/>
    </g>
    <path d="M55 53v143h343" stroke="#B8C0C7" stroke-width="1.2"/>
    <path d="M60 184C110 178 132 159 169 131S229 88 271 71 341 47 393 45" stroke="#B88C4F" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M60 185C110 177 135 155 168 130S218 107 246 114 296 140 324 150 365 162 393 163" stroke="#668DA8" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="211" cy="112" r="4" fill="#668DA8" stroke="#FFF" stroke-width="2"/>
    <path d="M211 122v74" stroke="#C9D3DB" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="287" y="35" fill="#A97F43" font-size="11">Proxy reward</text>
    <text x="275" y="185" fill="#557E9B" font-size="11">Intended behavior</text>
    <text x="226" y="215" text-anchor="middle" fill="#7B8289" font-size="10">Optimization steps →</text>
    <text transform="translate(34 131) rotate(-90)" text-anchor="middle" fill="#7B8289" font-size="10">Objective value</text>
    <text x="220" y="239" text-anchor="middle" fill="#9AA0A5" font-size="9">Conceptual illustration</text>
  </g>
</svg>
