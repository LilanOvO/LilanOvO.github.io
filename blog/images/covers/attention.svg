<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" fill="none">
  <title>Causal self-attention</title>
  <desc>Four input tokens form a lower triangular attention matrix. Each row can attend only to its own and earlier tokens, and produces a contextual output.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M1 1 5 3 1 5" stroke="#8C9298" stroke-width="1" fill="none"/></marker>
  </defs>
  <path fill="#FFF" d="M0 0h440v250H0z"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="24" y="28" fill="#737980" font-size="10" letter-spacing="1.4">CAUSAL SELF-ATTENTION</text>
    <g fill="#7B8289" font-size="10">
      <text x="43" y="60">TOKENS</text><text x="157" y="60">ATTENTION WEIGHTS</text><text x="341" y="60">OUTPUT</text>
    </g>
    <g fill="#F6F7F7" stroke="#DADDE0">
      <rect x="31" y="77" width="69" height="25" rx="5"/><rect x="31" y="110" width="69" height="25" rx="5"/>
      <rect x="31" y="143" width="69" height="25" rx="5"/><rect x="31" y="176" width="69" height="25" rx="5"/>
    </g>
    <g fill="#414950" font-size="12" text-anchor="middle">
      <text x="65.5" y="94">The</text><text x="65.5" y="127">cat</text><text x="65.5" y="160">sat</text><text x="65.5" y="193">.</text>
    </g>
    <g stroke="#C3C9CE" stroke-width="1" marker-end="url(#arrow)">
      <path d="M107 89.5h39"/><path d="M107 122.5h39"/><path d="M107 155.5h39"/><path d="M107 188.5h39"/>
      <path d="M296 89.5h34"/><path d="M296 122.5h34"/><path d="M296 155.5h34"/><path d="M296 188.5h34"/>
    </g>
    <g>
      <rect x="156" y="76" width="29" height="27" rx="3" fill="#D0A567"/>
      <rect x="191" y="76" width="29" height="27" rx="3" fill="#F1F3F4"/>
      <rect x="226" y="76" width="29" height="27" rx="3" fill="#F1F3F4"/>
      <rect x="261" y="76" width="29" height="27" rx="3" fill="#F1F3F4"/>
      <rect x="156" y="109" width="29" height="27" rx="3" fill="#CFDDE6"/>
      <rect x="191" y="109" width="29" height="27" rx="3" fill="#779BB4"/>
      <rect x="226" y="109" width="29" height="27" rx="3" fill="#F1F3F4"/>
      <rect x="261" y="109" width="29" height="27" rx="3" fill="#F1F3F4"/>
      <rect x="156" y="142" width="29" height="27" rx="3" fill="#E1E8ED"/>
      <rect x="191" y="142" width="29" height="27" rx="3" fill="#7195AD"/>
      <rect x="226" y="142" width="29" height="27" rx="3" fill="#CCDCE5"/>
      <rect x="261" y="142" width="29" height="27" rx="3" fill="#F1F3F4"/>
      <rect x="156" y="175" width="29" height="27" rx="3" fill="#E4EBEF"/>
      <rect x="191" y="175" width="29" height="27" rx="3" fill="#B8CEDB"/>
      <rect x="226" y="175" width="29" height="27" rx="3" fill="#7FA1B8"/>
      <rect x="261" y="175" width="29" height="27" rx="3" fill="#CEDDE6"/>
    </g>
    <g stroke="#D8DEE2" stroke-width="1.2">
      <path d="m201 85 8 8m27-8 8 8m27-8 8 8m-43 25 8 8m27-8 8 8m-8 25 8 8"/>
    </g>
    <g fill="#688CA6">
      <rect x="344" y="79" width="46" height="21" rx="4" opacity=".35"/>
      <rect x="344" y="112" width="46" height="21" rx="4" opacity=".6"/>
      <rect x="344" y="145" width="46" height="21" rx="4" opacity=".85"/>
      <rect x="344" y="178" width="46" height="21" rx="4" opacity=".5"/>
    </g>
    <text x="220" y="231" text-anchor="middle" fill="#8B9196" font-size="10">Each token attends to itself and earlier tokens.</text>
  </g>
</svg>
