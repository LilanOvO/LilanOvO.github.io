projects:
  - title: "Auto-Resubmit"
    period: "2026.04"
    detail: "An open-source tool for lossless migration of LaTeX paper projects across major conference templates, automating content extraction, template reassembly, compilation, and submission packaging."
    homepage_detail: "a practical open-source tool for lossless migration of LaTeX paper projects across conference templates such as ACL, NeurIPS, ICML, ICLR, CVPR, and AAAI, helping automate content extraction, template reassembly, compilation, and packaging for paper resubmission."
    url: "https://github.com/LilanOvO/Auto-Resubmit"
    stars_url: "https://github.com/LilanOvO/Auto-Resubmit"
  - title: "DeepSeek-R1-Safe"
    period: "2025.06"
    detail: "A safety-enhanced reasoning LLM project focused on safety data, pre-alignment, safety-oriented SFT, and fine-grained safety reinforcement learning."
    homepage_detail: "a safety-enhanced reasoning LLM jointly developed with Huawei on Ascend and MindSpeed-LLM, where I contributed to 1024-GPU large-scale training, safety data construction, safety-oriented supervised fine-tuning, and scalable deployment. The project emphasizes multidimensional safety corpus design, safety core reasoning pre-alignment, dynamic efficiency compensation during SFT, and fine-grained safety RL for jointly optimizing safety, alignment, and general reasoning capability."
    url: "https://github.com/ZJUAISafety/DeepSeek-R1-Safe"
    stars_url: "https://github.com/ZJUAISafety/DeepSeek-R1-Safe"

