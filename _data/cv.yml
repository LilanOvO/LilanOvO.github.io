  research:
    - title: "基于共识子空间对齐的大语言模型微调数据安全研究（共同第一作者）"
      venue: "EMNLP 2026 Main（CCF-B/THU-A）"
      detail: "针对下游微调可能削弱模型安全能力的问题，提出 DataShield 框架，在多个安全对齐模型上构建共识安全与不安全子空间，以可迁移的风险评分识别高风险样本和响应片段。该方法支持样本过滤与片段级掩码，在保持下游效用的同时提升不同模型上的微调安全性。"
    - title: "大语言模型安全对齐与机制可解释性研究（共同第一作者）"
      venue: "ACL 2026 Findings（CCF-A）"
      detail: "针对大语言模型安全机制不透明的问题，设计安全重要参数识别框架以量化模型中参数对安全能力的影响。研究揭示不同模型架构下安全关键参数的稀疏差异分布，并据此设计两种轻量化安全微调范式，以较少参数更新增强模型安全性并预防下游微调导致的安全能力衰减。"
    - title: "基于马尔可夫链自适应策略组合的 LLM 越狱研究（第一作者）"
      venue: "AAAI 2026（CCF-A）"
      detail: "针对现有越狱攻击依赖静态或单一策略的问题，设计并实现 MAJIC 自适应越狱框架。该框架构建包含优化与创新策略的伪装策略池，将策略顺序选择建模为马尔可夫链，并引入基于 Q-learning 启发的轻量化实时更新机制，在多种安全对齐模型上取得优异攻击效果。"
  project:
    title: "基于昇腾服务器的 DeepSeek-R1-Safe 模型千卡训练"
    meta: "项目成员，2025.06"
    detail: "根据千卡集群大规模训练背景，完成 1024 卡昇腾服务器训练环境中固件、驱动、CANN toolkit 及 Conda 环境的自动化部署与调试。围绕 LLM 安全对齐，设计安全数据筛选方案、构建专用安全数据集，并参与模型 SFT 训练；在 MMLU、GSM8K、CEVAL 及自建安全 Benchmark 上，相比 DeepSeek-R1，安全能力显著提升，通用任务性能下降均未超过 1%。"
